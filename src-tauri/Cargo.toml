[package]
name = "tidy"
version = "0.1.0"
edition = "2021"
description = "Mac cleaner with storage alerts"

[lib]
name = "tidy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
walkdir = "2"
dirs = "5"
libc = "0.2"
parking_lot = "0.12"
rusqlite = { version = "0.43.0", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
